# Missing pages get the site's 404 page (served by 404.php, which sets the 404 status)
error_page 404 /404.php;

# Redirect /index to clean root URL
location = /index {
    return 301 /;
}

# /R_combat/pudding serves pudding/R_combat.php (the page's note proofs)
location ~ ^/[RFC]_[A-Za-z0-9_]+/pudding$ {
    rewrite ^/([^/]+)/pudding$ /pudding/$1.php last;
}

# Rewrite extensionless URLs to .php via internal redirect
location / {
    try_files $uri $uri/ @extensionless;
}

location @extensionless {
    rewrite ^(.+)$ $1.php last;
}
