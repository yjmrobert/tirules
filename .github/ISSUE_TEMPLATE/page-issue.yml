name: Report a problem with a page
description: A rule note that is wrong, unclear, missing a source, or a broken link or layout.
labels: ["site report"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The page address, for example https://tirules2.com/R_combat
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Which note?
      description: Copy the note text (or describe the spot on the page).
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - The ruling is wrong
        - The wording is unclear
        - A source is missing or wrong
        - Something is missing
        - Broken link or layout
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What's wrong, and what should it say?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source (optional)
      description: A link to a ruling, FAQ, or rulebook page that supports the change.
